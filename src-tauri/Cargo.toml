[package]
name = "skill-switch"
version = "0.1.1"
description = "A local-first Agent Skills manager"
authors = ["Skill Switch contributors"]
edition = "2021"

[lib]
name = "skill_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
